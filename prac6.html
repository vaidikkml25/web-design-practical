<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scholarship / Seminar Registration Form</title>
</head>
<body>

<h2>Scholarship / Seminar Registration Form</h2>

<form>

    <!-- Personal Information -->
    <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

    </fieldset>

    <br>

    <!-- Academic Details -->
    <fieldset>
        <legend>Academic Details</legend>

        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">--Select--</option>
            <option value="btech">B.Tech</option>
            <option value="bsc">B.Sc</option>
            <option value="mtech">M.Tech</option>
            <option value="msc">M.Sc</option>
        </select><br><br>

        <label for="college">College Name:</label>
        <input type="text" id="college" name="college" required><br><br>

    </fieldset>

    <br>

    <!-- Gender (Radio Buttons) -->
    <fieldset>
        <legend>Gender</legend>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

    </fieldset>

    <br>

    <!-- Interests (Checkboxes) -->
    <fieldset>
        <legend>Areas of Interest</legend>

        <input type="checkbox" id="ai" name="interest" value="AI">
        <label for="ai">Artificial Intelligence</label><br>

        <input type="checkbox" id="web" name="interest" value="Web Development">
        <label for="web">Web Development</label><br>

        <input type="checkbox" id="data" name="interest" value="Data Science">
        <label for="data">Data Science</label><br>

    </fieldset>

    <br>

    <!-- Seminar Type -->
    <fieldset>
        <legend>Seminar Type</legend>

        <input type="radio" id="online" name="seminar" value="online" required>
        <label for="online">Online</label><br>

        <input type="radio" id="offline" name="seminar" value="offline">
        <label for="offline">Offline</label>

    </fieldset>

    <br>

    <!-- Submit -->
    <input type="submit" value="Register">

</form>

</body>
</html>
